name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # yalnızca main'e gönderimde Release oluşturmak için

jobs:
  build:
    name: Test, Lint ve Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Gradle wrapper doğrulama
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug APK derle
        run: ./gradlew --no-daemon assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v7
        with:
          name: supfy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK'yı adlandır
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Supfy-$VERSION-debug.apk"

      - name: Release olarak yayımla (debug)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Supfy ${{ env.VERSION }} (debug, derleme ${{ github.run_number }})
          prerelease: true
          files: Supfy-${{ env.VERSION }}-debug.apk
          body: |
            Otomatik debug derlemesi. Commit: ${{ github.sha }}
            Kurulum: APK'ya dokunun, istenirse "bilinmeyen uygulama yükleme" iznini verin.
            Bu sürüm imzasız (debug anahtarıyla imzalı) bir test sürümüdür.

      - name: Raporları yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supfy-raporlar
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
