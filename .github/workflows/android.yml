name: Android CI

on:
  push:
    branches: [main, 'gelistirme/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # yalnızca main'e gönderimde Release oluşturmak için

jobs:
  build:
    name: Test, Lint ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING_KEY: ${{ secrets.SUPFY_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Her derleme bir öncekinden büyük sürüm kodu alır (güncelleme olarak kurulabilsin diye).
      - name: Sürüm kodunu hesapla
        run: echo "SUPFY_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Gradle wrapper doğrulama
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          SUPFY_KEYSTORE_B64: ${{ secrets.SUPFY_KEYSTORE_B64 }}
        run: |
          echo "$SUPFY_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/supfy.jks"
          echo "SUPFY_KEYSTORE_PATH=$RUNNER_TEMP/supfy.jks" >> "$GITHUB_ENV"

      - name: İmza anahtarı yok uyarısı
        if: env.HAS_SIGNING_KEY != 'true'
        run: echo "::warning::SUPFY_KEYSTORE_B64 tanımlı değil. APK debug anahtarıyla imzalanacak ve mevcut kurulumun üzerine yüklenemeyebilir."

      - name: Birim testleri
        run: ./gradlew --no-daemon -PsupfyVersionCode=$SUPFY_VERSION_CODE testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon -PsupfyVersionCode=$SUPFY_VERSION_CODE lintDebug

      - name: APK derle
        env:
          SUPFY_KEYSTORE_PASSWORD: ${{ secrets.SUPFY_KEYSTORE_PASSWORD }}
          SUPFY_KEY_ALIAS: ${{ secrets.SUPFY_KEY_ALIAS }}
          SUPFY_KEY_PASSWORD: ${{ secrets.SUPFY_KEY_PASSWORD }}
        run: |
          TASKS="assembleDebug"
          if [ "$HAS_SIGNING_KEY" = "true" ]; then TASKS="assembleDebug assembleRelease"; fi
          ./gradlew --no-daemon -PsupfyVersionCode=$SUPFY_VERSION_CODE $TASKS

      - name: Yayımlanacak APK'yı seç
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "Supfy-$VERSION-$SUPFY_VERSION_CODE.apk"
            echo "APK_KIND=imzalı sürüm" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "Supfy-$VERSION-$SUPFY_VERSION_CODE-debug.apk"
            echo "APK_KIND=debug (geçici anahtar)" >> "$GITHUB_ENV"
          fi
          rm -f "$RUNNER_TEMP/supfy.jks"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: supfy-apk
          path: Supfy-*.apk
          if-no-files-found: error

      # Yalnızca kalıcı anahtarla imzalı derlemeler yayımlanır; aksi hâlde uygulama içi denetim
      # mevcut kurulumun üzerine yüklenemeyecek bir APK önerirdi.
      - name: Release olarak yayımla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SUPFY_VERSION_CODE }}
          name: Supfy ${{ env.VERSION }} (${{ env.SUPFY_VERSION_CODE }})
          prerelease: true
          files: Supfy-*.apk
          body: |
            Supfy ${{ env.VERSION }} · sürüm kodu ${{ env.SUPFY_VERSION_CODE }} · ${{ env.APK_KIND }}
            Commit: ${{ github.sha }}
            Kurulum: APK'ya dokunun, istenirse "bilinmeyen uygulama yükleme" iznini verin.

      - name: Raporları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supfy-raporlar
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
