name: Supfy V5 Android CI

on:
  push:
    branches: [main, 'supfy/**', 'gelistirme/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: V5 source checks, tests, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Turkish completeness and security regression guards
        run: |
          python3 tools/v5_localization_audit.py
          python3 tools/v5_localization_audit_test.py
          python3 tools/v5_security_audit.py --self-test
      - name: Core and application unit tests
        run: ./gradlew --no-daemon :api:test :api-spotify:test :extensions:test :host-android:testDebugUnitTest :app:testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: ARM debug APK and instrumentation package
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: supfy-v5-debug-apk
          path: |
            base/app/build/outputs/apk/debug/*.apk
            base/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Complete GPL corresponding source
        run: git archive --format=tar.gz --output=supfy-v5-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: supfy-v5-gpl-source
          path: supfy-v5-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supfy-v5-test-reports
          path: |
            base/**/build/reports/tests/
            base/app/build/reports/lint-results-debug.*
            docs/v5/
# CI debug builds use an ephemeral signing key. They are not an upgrade promise for
# an existing installation. Publishing a signed production release is a separate job.
